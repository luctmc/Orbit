[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit — orquestrador de agentes de código"
edition = "2021"
publish = false

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
libc = "0.2"

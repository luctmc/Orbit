name: Official release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# GitHub keeps one running and the newest pending release; never cancel a publication in flight.
concurrency:
  group: orbit-official-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require original updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY; never replace the key of installed apps.'; exit 1; }
      - run: npm ci
      - run: node --test scripts/*.test.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Skip commits already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].body' | grep -Fq "Source: $GITHUB_SHA"; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish signed update
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT_UPDATE_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node scripts/release-version.mjs)
          npm run release -- "$version" --notes "Atualização automática do Orbit. Source: $GITHUB_SHA" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-release-${{ github.sha }}
          path: dist-release/
          if-no-files-found: ignore
